<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IcônicosBet • Plataforma Demo de Apostas</title>

  <style>
    :root {
      --bg:#0e1a14;
      --card:#13261d;
      --header:#0b2a1c;
      --accent:#2ecc71;
      --text:#ffffff;
      --muted:#a8cbb7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--header);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent);
    }

    .slogan {
      font-size: 11px;
      color: var(--muted);
    }

    .balance {
      background: #1b3d2a;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
    }

    nav button {
      margin: 4px;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: #1b3d2a;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }

    nav button:hover {
      opacity: 0.9;
    }

    main {
      padding: 20px;
    }

    h2 {
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }
